# Full CDC stack: Postgres (logical decoding) -> Debezium Connect -> Redpanda (Kafka API)
# -> cdc-lake consumer -> Iceberg tables on MinIO (S3).
# Image tags are pinned to versions that exist upstream; they were NOT pulled or run in the
# environment this repo was built in (no Docker daemon there). The manual `e2e` workflow
# (.github/workflows/e2e.yml) starts this stack and runs scripts/e2e_smoke.sh.
name: cdc-lake

services:
  postgres:
    image: postgres:16.4-bookworm
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courses
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses"]
      interval: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports: ["8083:8083"]
    volumes:
      - ./connectors:/connectors:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      retries: 20

  consumer:
    build: .
    depends_on:
      redpanda: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["cdc-lake", "consume", "--bootstrap", "redpanda:9092"]
    environment:
      CDC_LAKE_ROOT: /lake
      CDC_LAKE_WAREHOUSE: s3://lake/warehouse
      CDC_LAKE_S3_ENDPOINT: http://minio:9000
      CDC_LAKE_S3_ACCESS_KEY: minioadmin
      CDC_LAKE_S3_SECRET_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - catalog:/lake  # the SQLite catalog; data files go to MinIO

volumes:
  catalog:
