[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-iceberg-lakehouse"
version = "0.1.0"
description = "Change data capture from Postgres to Apache Iceberg: Debezium envelopes, LSN-ordered merge, schema evolution, SCD2 history, time travel and table maintenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow]>=0.10,<0.13",
  "pyarrow>=16",
  "duckdb>=1.4",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
# Only for the Docker stack (Kafka consumer, Postgres load generator, S3 warehouse).
stream = ["confluent-kafka>=2.4", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "matplotlib>=3.8"]

[project.scripts]
cdc-lake = "cdc_lake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:unraisableexception --cov=cdc_lake --cov-report=term-missing:skip-covered"
filterwarnings = [
  "ignore::DeprecationWarning",
  # PyIceberg's SqlCatalog leaves its SQLite engine to the garbage collector.
  "ignore:unclosed database:ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["cdc_lake"]
# Needs Kafka and Postgres (Docker stack); exercised by the manual e2e workflow, not by pytest.
omit = ["*/cdc_lake/live.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
